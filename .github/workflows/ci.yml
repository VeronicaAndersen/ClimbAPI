name: CI

on:
  pull_request:
  push:
    branches: [Dev, main]

# Read-only token; nothing here needs to write to the repository.
permissions:
  contents: read

# A new push cancels the run still going for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Throwaway database for the Postgres throttle tests (tests/pg). The
      # password is a CI-only placeholder for this container, not a secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: climbapi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d climbapi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          # Not in requirements-dev.txt; pinned to the version used locally.
          python -m pip install ruff==0.17.4

      - name: Install dbmate
        env:
          DBMATE_VERSION: v2.37.0
          # SHA-256 of dbmate-linux-amd64 for that release (GitHub's asset
          # digest, checked against a download of the same file).
          DBMATE_SHA256: f855e99a0f0a81322014bf686b1cb820d2b4d8074e4eadafd64b851b80ecb15a
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  $RUNNER_TEMP/dbmate" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/dbmate" /usr/local/bin/dbmate
          dbmate --version

      - name: Apply migrations to the service database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/climbapi_ci?sslmode=disable
        run: dbmate --no-dump-schema --migrations-dir db/migrations up

      - name: Lint the files this branch changed
        # The repository still has 131 older ruff findings, so a repo-wide
        # check stays off for now. api/v1/auth.py is left out for its 4.
        run: |
          ruff check \
            security/client_address.py \
            security/login_ip_limit_postgres.py \
            security/login_throttle.py \
            security/login_throttle_postgres.py \
            security/rate_limit.py \
            tests/integration/test_integration_auth.py \
            tests/integration/test_integration_login_fallback.py \
            tests/integration/test_integration_rate_limit.py \
            tests/pg \
            tests/test_authenticate_user.py \
            tests/test_client_address.py \
            tests/test_login_throttle_backend.py \
            tests/test_login_throttle_postgres_unit.py \
            tests/test_rate_limit_settings.py

      - name: Run tests (including tests/pg against the service)
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/climbapi_ci
        run: python -m pytest -q
